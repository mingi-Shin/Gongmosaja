# === 공통 설정 (프로파일, 서비스 이름 등) ===
spring.application.name=gongmosaja

# === 설정 파일 쪼개서 가져오기 ===
# optional: 을 붙이면 파일 없어도 에러 안 내고 넘어감
spring.config.import=\
  optional:classpath:local-tomcat-server.properties,\
  optional:classpath:local-mybatis.properties,\
  optional:classpath:local-db.properties
  

# thymeleaf 캐시 false/ 배포때는 true로 
spring.thymeleaf.cache=false

# Spring Security debug (개발 -> true)
spring.security.debug=true

# Spring Security 전반의 동작 로그를 DEBUG 레벨로 출력 -> 인증(Authentication) 과정, 필터 체인 흐름, 기본적인 보안 판단 과정
logging.level.org.springframework.security=DEBUG
# 인가(Authorization) 판단 과정을 TRACE 레벨로 출력 -> @PreAuthorize, hasRole, hasAuthority 같은 표현식이 어떻게 평가되는지까지 상세히
logging.level.org.springframework.security.authorization=TRACE
# 접근 제어(AccessDecision) 내부 로직을 TRACE로 출력 -> AccessDecisionManager, Voter들이 왜 허용/거부했는지 근거를 로그로 보여줌
logging.level.org.springframework.security.access=TRACE